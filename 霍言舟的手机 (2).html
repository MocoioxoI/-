<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>霍言舟的iPhone</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='8' width='84' height='84' rx='22' fill='%23111'/><rect x='22' y='22' width='56' height='56' rx='14' fill='none' stroke='%23fff' stroke-width='5'/></svg>">
<style>
/* ============================================================
   霍言舟的iPhone —— 沉浸式"捡到手机"体验
   主题：iOS 高保真界面，冷灰暗色壁纸，低饱和、克制
   说明：所有文案均为占位，等你替换；壁纸为渐变占位，可换图
   ============================================================ */

:root{
  --bg:#050507;                    /* 页面背景 */
  --frame:#121216;                 /* 手机外框 */
  --screen-bg:#07070a;             /* 屏幕底色 */
  --ink:#f5f5f7;                   /* 主文字 */
  --ink-dim:rgba(245,245,247,.62);  /* 次要文字 */
  --ink-faint:rgba(245,245,247,.38);
  --gold:#d9b45b;                  /* 霍氏金 */
  --accent:#d9b45b;                /* 系统强调色（金） */
  --danger:#ff453a;                /* iOS 系统红 */
  --ok:#30d158;                    /* iOS 系统绿 */
  --card:rgba(255,255,255,.05);    /* 卡片底 */
  --line:rgba(255,255,255,.09);    /* 分隔线 */
  --key:#232327;                   /* 键盘键 */
  --key-press:#34343a;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  --font-display:"Didot","Bodoni 72","Playfair Display",Georgia,"Times New Roman",serif;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(1200px 800px at 80% -10%,#1c1a14,#050507 55%),
    radial-gradient(900px 600px at 10% 110%,#141008,#050507 60%),
    var(--bg);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;overflow:hidden;
  -webkit-user-select:none;user-select:none;
}

/* ============ 页面背景：金色星点 + 光晕 ============ */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1px 1px at 12% 22%,rgba(217,180,91,.5),transparent 60%),
    radial-gradient(1px 1px at 28% 68%,rgba(217,180,91,.4),transparent 60%),
    radial-gradient(1.5px 1.5px at 44% 32%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1px 1px at 61% 78%,rgba(217,180,91,.45),transparent 60%),
    radial-gradient(1px 1px at 73% 40%,rgba(255,255,255,.4),transparent 60%),
    radial-gradient(1.5px 1.5px at 87% 15%,rgba(217,180,91,.55),transparent 60%),
    radial-gradient(1px 1px at 92% 60%,rgba(255,255,255,.35),transparent 60%),
    radial-gradient(1px 1px at 18% 88%,rgba(217,180,91,.4),transparent 60%),
    radial-gradient(1px 1px at 55% 12%,rgba(255,255,255,.45),transparent 60%),
    radial-gradient(1px 1px at 82% 88%,rgba(217,180,91,.35),transparent 60%);
}
.glow{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(600px 300px at 50% 115%,rgba(217,180,91,.08),transparent 70%),
    radial-gradient(500px 300px at 15% 0%,rgba(217,180,91,.05),transparent 70%);
}

/* ============ 手机外框 ============ */
.phone{
  position:relative;z-index:1;
  width:375px;height:812px;
  background:var(--frame);
  border-radius:56px;
  padding:14px;
  box-shadow:0 0 0 2px #000,0 0 0 4px #2e2e33,0 30px 80px rgba(0,0,0,.65),0 8px 24px rgba(0,0,0,.5);
}
.phone::before{ /* 侧键阴影微光 */
  content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:56px;
  background:linear-gradient(160deg,rgba(255,255,255,.08),transparent 30%,transparent 70%,rgba(0,0,0,.35));
  pointer-events:none;z-index:3;
}
.screen{
  position:relative;width:100%;height:100%;
  background:var(--screen-bg);
  border-radius:43px;overflow:hidden;
}
/* 灵动岛 */
.island{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:126px;height:34px;background:#000;border-radius:20px;z-index:40;
  display:flex;align-items:center;justify-content:center;
}
.island::after{content:"";width:8px;height:8px;border-radius:50%;background:#0d0d0d;box-shadow:inset 0 0 3px rgba(255,255,255,.1)}

/* 状态栏 */
.statusbar{
  position:absolute;top:0;left:0;right:0;height:52px;z-index:39;
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 26px 0 30px;padding-top:env(safe-area-inset-top,0);
  color:var(--ink);font-size:15px;font-weight:600;font-family:var(--font-num);
  pointer-events:none;
}
.statusbar .right{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}

/* ============ 视图容器 ============ */
.view{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--screen-bg)}
.view.active{display:flex}
.view.enter{animation:viewIn .32s cubic-bezier(.2,.8,.3,1)}
.view.leave{animation:viewOut .22s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-8px)}}

/* ============================================================
   视图一：锁屏
   ============================================================ */
#view-lockscreen{background:
  radial-gradient(150% 80% at 50% -10%,rgba(160,130,60,.32),transparent 60%),
  radial-gradient(140% 70% at 18% 115%,rgba(60,50,25,.5),transparent 65%),
  radial-gradient(130% 60% at 88% 100%,rgba(120,100,45,.22),transparent 60%),
  linear-gradient(180deg,#171510 0%,#07070a 100%)}
.lock-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 24px 24px}
.lock-top{padding-top:96px;text-align:center}
.lock-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%}
.lock-date{font-size:15px;color:var(--ink-dim);letter-spacing:.5px;margin-bottom:6px}
.lock-time{font-family:var(--font-num);font-weight:200;font-size:82px;line-height:1;letter-spacing:-1px}
.lock-sub{font-size:15px;color:var(--ink-dim);margin-top:10px;display:flex;align-items:center;gap:6px}
.lock-sub svg{width:14px;height:14px;opacity:.8}

.lock-hint{font-size:14px;color:var(--ink-faint);margin:10px 0 2px;letter-spacing:.3px}

/* 密码键盘 */
.pad{width:100%;max-width:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px 12px;justify-items:center}
.key{
  width:74px;height:74px;border-radius:50%;
  background:rgba(255,255,255,.1);color:var(--ink);
  font-size:30px;font-family:var(--font-num);font-weight:400;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .08s,background .1s;border:none;
}
.key:active{background:rgba(255,255,255,.22);transform:scale(.94)}
.key.blank{background:transparent;pointer-events:none}
.key.fn{font-size:0;background:transparent}
.key.fn:active{background:transparent}
.key.fn svg{width:26px;height:26px;stroke:rgba(255,255,255,.75);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.key.fn:active svg{stroke:#fff}

/* 密码圆点 */
.dots{display:flex;gap:14px;margin:26px 0 8px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);transition:background .12s,transform .12s}
.dot.on{background:#fff;border-color:#fff;transform:scale(1.05)}

/* ============================================================
   视图二：生物识别（面容 + 指纹）
   ============================================================ */
#view-bio{background:
  radial-gradient(130% 55% at 50% -10%,rgba(150,125,55,.28),transparent 60%),
  radial-gradient(140% 60% at 50% 120%,rgba(50,42,20,.4),transparent 65%),
  #050507;
  align-items:center;justify-content:center}
.bio-stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.face-top{position:absolute;top:92px;text-align:center;width:100%}
.face-title{font-size:20px;font-weight:600;letter-spacing:.3px}
.face-sub{font-size:14px;color:var(--ink-dim);margin-top:6px}

/* 摄像头模拟：暗色 + 扫描线 */
.face-cam{
  width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#12100a,#050507 72%);
  position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 2px rgba(217,180,91,.15),inset 0 0 70px rgba(0,0,0,.95);
  transition:border-color .3s,box-shadow .3s;
}
/* 面部取景框 */
.face-cam .viewfinder{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:92px;height:92px;border-radius:14px;
  border:1.5px solid rgba(217,180,91,.7);
  box-shadow:0 0 16px rgba(217,180,91,.18);
  animation:viewfinder 2s ease-in-out infinite;
  z-index:2;
}
.face-cam .viewfinder::before,.face-cam .viewfinder::after{
  content:"";position:absolute;width:14px;height:14px;border:2px solid var(--gold);
}
.face-cam .viewfinder::before{top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:6px 0 0 0}
.face-cam .viewfinder::after{bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 6px 0}
@keyframes viewfinder{0%,100%{box-shadow:0 0 16px rgba(217,180,91,.18)}50%{box-shadow:0 0 28px rgba(217,180,91,.4)}}
/* 扫描线（金） */
.face-cam::before{
  content:"";position:absolute;left:8px;right:8px;height:60px;top:-70px;
  background:linear-gradient(180deg,transparent,rgba(217,180,91,.6),transparent);
  filter:blur(1px);
  animation:scan 1.6s ease-in-out infinite;
  z-index:3;
}
@keyframes scan{0%{top:-70px}50%{top:170px}100%{top:-70px}}
.face-cam .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(217,180,91,.12)}
.face-cam .ring.r2{inset:22px;border-color:rgba(217,180,91,.08)}
.face-cam .dot{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:rgba(217,180,91,.3);filter:blur(1px)}
/* 识别状态环 */
.face-cam .scan-progress{
  position:absolute;inset:5px;border-radius:50%;z-index:2;
  background:conic-gradient(from 0deg,rgba(217,180,91,.7),transparent 70%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
  animation:progress 1.6s linear infinite;
  opacity:.7;
}
@keyframes progress{to{transform:rotate(360deg)}}

/* 指纹识别 */
.finger-cam{
  width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle at 50% 42%,#141108,#06070a 72%);
  position:relative;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);
  box-shadow:inset 0 0 0 2px rgba(217,180,91,.14),inset 0 0 70px rgba(0,0,0,.95);
  transition:border-color .3s,box-shadow .3s;
  cursor:pointer;
}
.finger-cam .finger-svg{width:74px;height:74px;position:relative;z-index:2;animation:fingerPulse 1.8s ease-in-out infinite;color:var(--gold)}
@keyframes fingerPulse{0%,100%{opacity:.5}50%{opacity:1}}
.finger-cam .finger-ring{position:absolute;inset:-10px;border-radius:50%;border:1.5px solid rgba(217,180,91,.5);animation:ringExpand 2.2s ease-out infinite}
@keyframes ringExpand{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.3);opacity:0}}
.finger-cam.pressing .finger-svg{animation:none;color:var(--gold)}
.finger-cam.pressing{box-shadow:inset 0 0 0 2px rgba(217,180,91,.7),0 0 30px rgba(217,180,91,.4)}

.face-status{margin-top:44px;text-align:center;font-size:15px;color:var(--ink-dim);min-height:24px}

/* ============================================================
   弹窗 —— 警告 / 温柔 / 金色准入
   ============================================================ */
.modal-overlay{
  position:absolute;inset:0;z-index:60;
  background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;padding:20px;
  pointer-events:none;
  transition:opacity .22s ease,visibility .22s;
}
.modal-overlay.show{opacity:1;visibility:visible;pointer-events:auto}
/* 弹窗弹出动画（回弹感） */
.modal-overlay.show .modal{animation:modalPop .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes modalPop{
  0%{transform:scale(.72) translateY(26px);opacity:0}
  60%{transform:scale(1.04) translateY(-3px);opacity:1}
  100%{transform:scale(1) translateY(0);opacity:1}
}
/* 弹窗消失动画 */
.modal-overlay.hide .modal{animation:modalShrink .2s ease forwards}
@keyframes modalShrink{to{transform:scale(.85) translateY(12px);opacity:0}}
.modal{
  width:100%;max-width:280px;border-radius:22px;
  background:#2c2c2e;box-shadow:0 20px 60px rgba(0,0,0,.6);
  overflow:hidden;
  text-align:center;
}
.modal-icon{height:88px;display:flex;align-items:center;justify-content:center}
.modal-icon svg{width:46px;height:46px}
.modal-title{font-size:17px;font-weight:600;padding:0 24px;line-height:1.35}
.modal-body{font-size:14px;color:var(--ink-dim);padding:10px 24px 22px;line-height:1.5}
.modal-actions{display:flex;border-top:1px solid var(--line)}
.modal-actions.one .ma-btn{width:100%}
.modal-actions .ma-btn{
  flex:1;padding:15px;background:none;border:none;color:var(--accent);
  font-size:16px;cursor:pointer;transition:background .12s;
}
.modal-actions .ma-btn:active{background:rgba(255,255,255,.06)}
.modal-actions .ma-btn + .ma-btn{border-left:1px solid var(--line)}
.modal-actions .ma-btn.warn{color:var(--danger)}
.modal-actions .ma-btn.done{color:var(--ok);font-weight:600}

/* 温柔风格 */
.modal.soft{background:linear-gradient(180deg,#2b2f33,#262a2e)}
.modal.soft .modal-title{color:#fff}

/* 闯入警告：红色脉冲（图标 + 边框） */
.modal.warning{background:linear-gradient(180deg,#3a2020,#2a1616)}
.modal.warning .modal-title{color:#ff6b61}
.modal.warning .modal-body{color:rgba(255,255,255,.75)}
.modal.warning .modal-icon svg{animation:iconPulse 1s ease-in-out infinite}
@keyframes iconPulse{0%,100%{filter:drop-shadow(0 0 4px rgba(255,69,58,.3))}50%{filter:drop-shadow(0 0 14px rgba(255,69,58,.8))}}

/* 金色准入 */
.modal.gold{
  background:linear-gradient(180deg,#33291a,#1d1810);
  border:1px solid rgba(217,180,91,.35);
  box-shadow:0 0 40px rgba(217,180,91,.18),0 20px 60px rgba(0,0,0,.6);
}
.modal.gold .modal-title{
  color:#f0d48a;
  text-shadow:0 0 16px rgba(217,180,91,.4);
}
.modal.gold .modal-icon svg{filter:drop-shadow(0 0 14px rgba(217,180,91,.65))}
.modal.gold .modal-body{color:rgba(240,212,160,.9)}
.modal.gold .modal-actions{border-color:rgba(217,180,91,.25)}
.modal.gold .ma-btn{color:#e8c87a}
.modal.gold .ma-btn.done{color:#f0d48a;font-weight:700}

/* ============================================================
   霍氏 LOGO 转场层
   ============================================================ */
#logoOverlay{
  position:absolute;inset:0;z-index:80;
  align-items:center;justify-content:center;flex-direction:column;
  background:
    radial-gradient(120% 80% at 50% 40%,#221a0c 0%,#0a0805 60%,#000 100%),
    #000;
  overflow:hidden;
  opacity:0;visibility:hidden;pointer-events:none;
  display:flex;
  transition:opacity .35s ease,visibility .35s;
}
#logoOverlay.show{opacity:1;visibility:visible;pointer-events:auto}
/* 外圈光环 */
.logo-burst{
  position:absolute;width:360px;height:360px;border-radius:50%;
  background:radial-gradient(circle,rgba(217,180,91,.45),transparent 60%);
  opacity:0;transform:scale(.4);
}
#logoOverlay.show .logo-burst{animation:burst 2.2s ease forwards}
.logo-burst::before,.logo-burst::after{
  content:"";position:absolute;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-50%);
}
.logo-burst::before{width:70%;height:70%;border:1px solid rgba(217,180,91,.5)}
.logo-burst::after{width:52%;height:52%;border:1px solid rgba(217,180,91,.3)}
#logoOverlay.show .logo-burst::before{animation:ringOut 2.2s ease forwards}
@keyframes ringOut{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}40%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0}}
@keyframes burst{0%{transform:scale(.2);opacity:0}26%{transform:scale(1);opacity:.9}100%{transform:scale(1.4);opacity:0}}
.logo-mark{position:relative;z-index:2;text-align:center;opacity:0;transform:scale(1.4)}
#logoOverlay.show .logo-mark{animation:markIn 1s cubic-bezier(.2,.8,.3,1) .3s forwards}
@keyframes markIn{0%{transform:scale(1.4);opacity:0;letter-spacing:40px}100%{transform:scale(1);opacity:1;letter-spacing:normal}}
.logo-kicker{font-size:13px;letter-spacing:7px;color:rgba(217,180,91,.85);opacity:0}
#logoOverlay.show .logo-kicker{animation:fadeUp .8s ease .55s forwards}
.logo-char{
  margin-top:18px;font-size:110px;font-weight:900;line-height:1;letter-spacing:14px;padding-left:14px;
  background:linear-gradient(180deg,#ffe9a8,#d9b45b 45%,#8f6b1f);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 24px rgba(217,180,91,.45));
}
.logo-rule{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:22px;opacity:0}
.logo-rule::before,.logo-rule::after{content:"";width:46px;height:1px;background:linear-gradient(90deg,transparent,rgba(217,180,91,.8));}
.logo-rule::after{background:linear-gradient(90deg,rgba(217,180,91,.8),transparent)}
.logo-rule span{width:6px;height:6px;transform:rotate(45deg);background:var(--gold)}
#logoOverlay.show .logo-rule{animation:fadeUp .8s ease .8s forwards}
.logo-sub{margin-top:16px;font-size:14px;letter-spacing:6px;color:rgba(217,180,91,.85);opacity:0}
#logoOverlay.show .logo-sub{animation:fadeUp .8s ease .95s forwards}
.logo-tag{
  position:relative;z-index:2;margin-top:36px;
  padding:8px 26px;border:1px solid rgba(217,180,91,.5);border-radius:26px;
  font-size:12px;letter-spacing:4px;color:#e8c87a;opacity:0;
  box-shadow:0 0 20px rgba(217,180,91,.12),inset 0 0 14px rgba(217,180,91,.05);
}
#logoOverlay.show .logo-tag{animation:fadeUp .8s ease 1.15s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.logo-shine{position:absolute;top:0;bottom:0;width:150px;left:-40%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-20deg)}
#logoOverlay.show .logo-shine{animation:shine 2.3s ease forwards}
@keyframes shine{0%{left:-40%}48%{left:140%}100%{left:140%}}

/* ============================================================
   浮现句：小乖想看当然要给呀
   ============================================================ */
#revealOverlay{
  position:absolute;inset:0;z-index:70;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(120% 90% at 50% 50%,#171006 0%,#070503 60%,#000 100%);
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .4s ease,visibility .4s;
}
#revealOverlay.show{opacity:1;visibility:visible}
.reveal-text{
  font-size:26px;font-weight:700;letter-spacing:3px;color:#f0d48a;
  text-shadow:0 0 24px rgba(217,180,91,.5);
  opacity:0;transform:scale(.85);
}
#revealOverlay.show .reveal-text{animation:revealIn 1s cubic-bezier(.2,.8,.3,1) .2s forwards}
.reveal-sub{
  margin-top:16px;font-size:13px;letter-spacing:8px;color:rgba(217,180,91,.75);
  opacity:0;
}
#revealOverlay.show .reveal-sub{animation:fadeUp .9s ease .8s forwards}
@keyframes revealIn{0%{transform:scale(.85);opacity:0;filter:blur(6px)}100%{transform:scale(1);opacity:1;filter:blur(0)}}

/* 校准进度条 */
.cal-progress{width:100%;max-width:180px;height:4px;background:rgba(255,255,255,.12);border-radius:2px;margin:18px auto 0;overflow:hidden}
.cal-progress .bar{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .4s ease}

/* ============================================================
   视图三：主屏幕
   ============================================================ */
#view-homescreen{background:
  radial-gradient(150% 65% at 50% -10%,rgba(160,130,60,.32),transparent 62%),
  radial-gradient(150% 70% at 12% 115%,rgba(60,50,25,.42),transparent 65%),
  radial-gradient(130% 60% at 92% 100%,rgba(130,105,50,.22),transparent 60%),
  linear-gradient(180deg,#171510 0%,#07070a)}
.home-head{
  padding:70px 22px 4px;display:flex;align-items:baseline;gap:8px;
}
.home-head .title{font-size:30px;font-weight:700;letter-spacing:.2px}
.home-head .badge{font-size:13px;color:var(--ink-dim);padding:3px 9px;border-radius:20px;background:rgba(255,255,255,.08)}
.home-grid{
  flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px;
  padding:26px 18px 20px;align-content:start;
}
.app-icon{
  display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;border:none;background:none;padding:0;
}
.app-icon:active{transform:scale(.92)}
.app-icon .tile{
  width:60px;height:60px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);
}
.app-icon .tile svg{width:30px;height:30px}
.app-icon .name{font-size:11px;color:rgba(255,255,255,.92);text-align:center;line-height:1.15;max-width:68px;text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* 底部 Dock */
.home-dock{
  margin:6px 14px 34px;background:rgba(255,255,255,.09);border-radius:26px;
  padding:14px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.home-dock .app-icon .tile{width:52px;height:52px;border-radius:13px}
.home-dock .app-icon .tile svg{width:26px;height:26px}

/* ============================================================
   视图四：App 页面（共用壳）
   ============================================================ */
#view-app{background:var(--screen-bg)}
.app-nav{
  display:flex;align-items:center;gap:6px;padding:64px 14px 8px;position:relative;
}
.app-nav .back{
  display:flex;align-items:center;gap:2px;background:none;border:none;
  color:var(--accent);font-size:16px;cursor:pointer;padding:4px 6px;border-radius:8px;
}
.app-nav .back:active{background:rgba(255,255,255,.06)}
.app-nav .back svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app-nav .nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:17px;font-weight:600;letter-spacing:.2px}
.app-body{flex:1;overflow-y:auto;padding:6px 18px 40px;-webkit-overflow-scrolling:touch}
.app-body::-webkit-scrollbar{display:none}

/* 占位内容通用样式 */
.placeholder-note{font-size:12px;color:var(--ink-faint);letter-spacing:.3px;margin-bottom:14px}

/* 日记 */
.journal-card{
  background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px;
  border-left:3px solid rgba(255,255,255,.18);
}
.journal-card .date{font-size:12px;color:var(--ink-faint);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.journal-card .date .lock{font-size:11px;color:var(--ink-dim);display:flex;align-items:center;gap:4px}
.journal-card .date .lock svg{width:11px;height:11px}
.journal-card .journal-title{font-size:17px;font-weight:600;margin:2px 0 12px;color:#fff;letter-spacing:.4px}
.journal-card p{font-size:15px;line-height:1.75;color:rgba(255,255,255,.9);margin-bottom:14px}
.journal-card p:last-child{margin-bottom:0}

/* 备忘录 */
.memo-list .memo{
  background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
  transition:background .12s;
}
.memo-list .memo:active{background:rgba(255,255,255,.1)}
.memo-list .memo h4{font-size:15px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.memo-list .memo h4 .pin{color:var(--accent);font-size:13px}
.memo-list .memo p{font-size:13px;color:var(--ink-dim);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo-list .memo .meta{font-size:11px;color:var(--ink-faint);margin-top:8px}

/* 资产 */
.wallet-cards{padding-top:6px}
.asset-hero{
  position:relative;overflow:hidden;border-radius:22px;padding:28px 20px 24px;text-align:center;margin-bottom:22px;
  background:
    radial-gradient(120% 160% at 50% -20%, rgba(217,180,91,.22), transparent 55%),
    linear-gradient(180deg,#17161a,#0b0b10);
  border:1px solid rgba(217,180,91,.3);
}
.asset-hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(1.5px 1.5px at 20% 30%,rgba(217,180,91,.6),transparent),
  radial-gradient(1px 1px at 60% 70%,rgba(217,180,91,.4),transparent),
  radial-gradient(1px 1px at 85% 40%,rgba(217,180,91,.5),transparent);
  background-size:220px 220px,160px 160px,200px 200px;
}
.asset-hero .asset-label{position:relative;font-size:12px;letter-spacing:4px;color:var(--ink-dim);text-transform:uppercase}
.asset-hero .asset-big{position:relative;margin:14px 0 8px;display:flex;align-items:baseline;justify-content:center;gap:6px;flex-wrap:nowrap}
.asset-hero .asset-big .cur{font-size:28px;color:var(--gold);font-family:var(--font-display);font-weight:400}
.asset-hero .asset-big .num{
  font-size:40px;font-weight:500;letter-spacing:1px;
  font-family:var(--font-display);white-space:nowrap;
  background:linear-gradient(178deg,#fdf0c8 0%,#f3d689 30%,#e3b24f 50%,#c9972f 68%,#8a6420 86%,#f0d48a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(217,180,91,.4)) drop-shadow(0 2px 3px rgba(0,0,0,.65));
}
.asset-hero .asset-sub{position:relative;font-size:12px;color:var(--ink-dim)}
.asset-hero .asset-sub .up{color:#30d158;font-weight:600}
.asset-hero .asset-spark{position:relative;height:44px;margin-top:10px;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.asset-hero .asset-spark span{width:5px;border-radius:3px;background:linear-gradient(180deg,#d9b45b,#6b541f);opacity:.75}
.asset-sec-title{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;letter-spacing:1px;color:var(--ink-dim);margin:20px 0 10px}
.asset-sec-title span{color:var(--ink);font-weight:600}
.asset-sec-title .total{font-family:var(--font-num);color:var(--gold);font-size:12px}
.asset-sec-title em{font-style:normal;font-size:11px;color:var(--ink-faint)}
/* 资产结构饼图 */
.asset-structure{display:flex;align-items:center;gap:16px;padding:16px;border-radius:18px;background:linear-gradient(180deg,rgba(217,180,91,.07),transparent);border:1px solid rgba(217,180,91,.18)}
.donut{width:168px;height:168px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.donut svg{width:100%;height:100%;display:block;overflow:visible}
.donut svg text{font-family:var(--font-num);font-weight:600}
.donut-labels{position:absolute;inset:0;pointer-events:none}
.donut-labels .dlb{
  position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;color:#fff;
  font-family:var(--font-num);text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 2px rgba(0,0,0,.9);
}
.donut-hole{position:absolute;width:62px;height:62px;border-radius:50%;background:#131217;box-shadow:0 0 0 3px rgba(11,11,16,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;z-index:3;pointer-events:none}
.donut-hole .dv{font-family:var(--font-num);font-size:12px;color:var(--gold);font-weight:700}
.donut-hole .dl{font-size:8px;color:var(--ink-faint)}
.donut-legend{flex:1;display:flex;flex-direction:column;gap:7px}
.donut-legend .dl-item{display:flex;align-items:center;gap:8px;font-size:12px}
.donut-legend .dl-item .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.donut-legend .dl-item .dl-n{flex:1;color:rgba(255,255,255,.9)}
.donut-legend .dl-item .dl-v{font-family:var(--font-num);color:var(--gold);font-size:11px}
.asset-list{display:flex;flex-direction:column;gap:2px}
.asset-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
.asset-row .a-main{display:flex;flex-direction:column;gap:2px}
.asset-row .a-name{font-size:14px;font-weight:500;color:rgba(255,255,255,.92)}
.asset-row .a-note{font-size:11px;color:var(--ink-faint)}
.asset-row .a-val{font-family:var(--font-num);font-size:14px;color:var(--gold)}
/* 堆叠卡片（滑动换卡） */
.card-stack{position:relative;padding-top:14px;min-height:190px;touch-action:pan-y}
.card-stack .paycard{
  margin-bottom:0;position:absolute;left:0;right:0;top:0;cursor:pointer;
  transition:transform .22s ease,opacity .22s ease,box-shadow .22s ease;
}
.card-hint{text-align:center;font-size:11px;color:var(--ink-faint);padding:12px 0 4px;letter-spacing:1px}
.paycard{
  border-radius:20px;padding:20px 22px;color:#fff;position:relative;overflow:hidden;
  min-height:150px;display:flex;flex-direction:column;justify-content:space-between;
}
.paycard:active{transform:scale(.98)}
.paycard::after{content:"";position:absolute;top:-40px;right:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.06)}
.paycard .issuer{font-size:13px;letter-spacing:1px;opacity:.9}
.paycard .num{font-family:var(--font-num);font-size:15px;letter-spacing:2px;opacity:.85;margin-top:22px}
.paycard .holder{font-size:12px;opacity:.8;display:flex;justify-content:space-between;align-items:center}
.paycard .pc-head{display:flex;flex-direction:column;gap:10px}
.paycard .chip{width:30px;height:22px;border-radius:4px;background:linear-gradient(135deg,#e9c46a,#c9972f);margin-bottom:10px}
.paycard .bal{font-family:var(--font-num);font-size:12px;opacity:.9}
.paycard.dark{background:linear-gradient(135deg,#23232a,#111116);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.paycard.mid{background:linear-gradient(135deg,#2f3b52,#1a2233)}
.paycard.gold{background:linear-gradient(135deg,#2c2a22,#181712);border:1px solid rgba(217,180,91,.35)}
.paycard .tag{position:absolute;top:18px;right:18px;font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(255,255,255,.15);letter-spacing:1px}
/* 账单页 */
.bill-view{display:flex;flex-direction:column}
.bill-head{display:flex;align-items:center;gap:12px;padding:6px 0 14px;border-bottom:1px solid var(--line)}
.bill-head .bill-back{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bill-head .bill-back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.bill-head .bill-title{font-size:16px;font-weight:600;flex:1}
.bill-head .bill-tag{font-size:11px;padding:3px 9px;border-radius:12px;background:rgba(217,180,91,.15);color:var(--gold)}
.bill-balance{margin:18px 0;text-align:center;padding:16px;border-radius:16px;background:linear-gradient(180deg,rgba(217,180,91,.1),transparent);border:1px solid rgba(217,180,91,.2)}
.bill-balance span{display:block;font-size:12px;color:var(--ink-dim)}
.bill-balance .v{font-family:var(--font-num);font-size:26px;font-weight:700;color:var(--gold);margin-top:6px}
.bill-list{display:flex;flex-direction:column}
.bill-item{display:flex;justify-content:space-between;align-items:center;padding:14px 2px;border-bottom:1px solid rgba(255,255,255,.05)}
.bill-item .bi-main{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.bill-item .bi-name{font-size:14px;color:rgba(255,255,255,.92)}
.bill-item .bi-date{font-size:11px;color:var(--ink-faint)}
.bill-item .bi-amt{font-family:var(--font-num);font-size:14px;color:var(--ink);flex-shrink:0;margin-left:12px}

/* 信息（微信风格） */
.msg-page{display:flex;flex-direction:column;height:100%}
/* 会话列表 */
.conv-list{padding:4px 0}
.conv{
  display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;border-radius:12px;
  transition:background .12s;border-bottom:1px solid var(--line);
}
.conv:active{background:rgba(255,255,255,.06)}
.conv .c-avatar{
  width:48px;height:48px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#fff;
}
.conv .c-main{flex:1;min-width:0}
.conv .c-top{display:flex;align-items:center;justify-content:space-between}
.conv .c-name{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .c-time{font-size:11px;color:var(--ink-faint);flex-shrink:0;margin-left:8px}
.conv .c-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:3px}
.conv .c-last{font-size:13px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .c-badge{
  min-width:18px;height:18px;border-radius:10px;background:var(--danger);color:#fff;
  font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex-shrink:0;margin-left:8px;
}
.conv .c-badge.zero{visibility:hidden}
/* 聊天详情 */
.chat-view{display:none;flex-direction:column;height:100%}
.chat-view.active{display:flex}
.chat-head{display:flex;align-items:center;gap:10px;padding:8px 4px 10px;border-bottom:1px solid var(--line)}
.chat-head .ch-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff}
.chat-head .ch-name{font-size:16px;font-weight:600}
.chat-body{flex:1;overflow-y:auto;padding:12px 0;display:flex;flex-direction:column;gap:10px}
.chat-empty{text-align:center;color:var(--ink-faint);font-size:14px;padding:40px 0}
.msg-session{display:flex;flex-direction:column;gap:10px}
.msg-day{text-align:center;font-size:11px;color:var(--ink-faint);margin:6px 0}
.msg-row{display:flex}
.msg-row.them{justify-content:flex-start}
.msg-row.me{justify-content:flex-end}
.msg-row.them .bubble{background:rgba(255,255,255,.14)}
.msg-row.me .bubble{background:#0b5c3b}
.bubble{max-width:74%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.55;position:relative}
.bubble .sub{font-size:10px;color:var(--ink-faint);margin-top:4px;text-align:right}
.msg-row.me .bubble .sub{color:rgba(255,255,255,.5)}
.msg-row .avatar{width:34px;height:34px;border-radius:50%;margin-right:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff}
.msg-row.me .avatar{display:none;margin:0 0 0 8px}
.chat-input{
  display:flex;gap:8px;align-items:center;padding:10px 0 4px;border-top:1px solid var(--line);
}
.chat-input .box{
  flex:1;background:rgba(255,255,255,.08);border-radius:20px;padding:9px 14px;font-size:14px;color:var(--ink-dim);
}
.chat-input .send{color:var(--accent);font-size:15px;font-weight:600;background:none;border:none;cursor:pointer;padding:6px}

/* 时钟：圆形表盘 + 日历提醒 */
.clock-line{width:100%;height:1px;background:var(--line);margin:22px 0}
.clock-cal{width:100%}
.cal-detail{width:100%}
.cal-none{text-align:center;color:var(--ink-faint);font-size:13px;padding:26px 0}
.cal-title{font-size:13px;color:var(--ink-faint);letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.cal-title svg{width:14px;height:14px}
.cal-item{
  background:var(--card);border-radius:14px;padding:13px 15px;margin-bottom:10px;display:flex;gap:13px;align-items:center;
  border-left:3px solid var(--gold);
}
.cal-item .cal-date{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:44px}
.cal-item .cal-date .m{font-size:11px;color:var(--gold);letter-spacing:1px}
.cal-item .cal-date .d{font-size:24px;font-weight:700;color:var(--ink);line-height:1.1}
.cal-item .cal-info{flex:1;min-width:0}
.cal-item .cal-info h4{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.cal-item .cal-info h4 .tag{font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(217,180,91,.18);color:var(--gold);font-weight:500}
.cal-item .cal-info p{font-size:13px;color:var(--ink-dim);margin-top:3px;line-height:1.45}
.cal-item .cal-info .cal-time{font-size:11px;color:var(--ink-faint);margin-top:5px}
.cal-item.green{border-left-color:#30d158}
.cal-item.green .cal-date .m{color:#30d158}
.cal-item.green .cal-info h4 .tag{background:rgba(48,209,88,.16);color:#30d158}
.cal-item.blue{border-left-color:#5aa2ff}
.cal-item.blue .cal-date .m{color:#5aa2ff}
.cal-item.blue .cal-info h4 .tag{background:rgba(90,162,255,.16);color:#5aa2ff}
.cal-item.gold{border-left-color:#d9b45b}
.cal-item.gold .cal-date .m{color:#d9b45b}
.cal-item.gold .cal-info h4 .tag{background:rgba(217,180,91,.16);color:#d9b45b}

/* ===== 日历：月历视图 ===== */
.calendar-page{padding-top:4px}
.cal-monthbar{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.cal-monthbar .cal-mo{font-size:28px;font-weight:700}
.cal-monthbar .cal-year{font-size:14px;color:var(--ink-dim)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--ink-faint);margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-cell{
  height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;
  border-radius:9px;position:relative;color:var(--ink);cursor:pointer;transition:background .15s,color .15s;
}
.cal-cell:not(.dim):hover{background:rgba(217,180,91,.12)}
.cal-cell.sel{background:rgba(217,180,91,.22);box-shadow:inset 0 0 0 1px rgba(217,180,91,.5);color:var(--gold);font-weight:700}
.cal-cell.dim{color:var(--ink-faint);cursor:default}
.cal-cell.today{background:var(--gold);color:#1a1508;font-weight:700;box-shadow:0 2px 10px rgba(217,180,91,.35)}
.cal-cell.dot::after{content:"";position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}
.cal-cell.today::after{background:#1a1508}
.cal-legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;font-size:11px;color:var(--ink-faint);margin-top:8px}
.cal-legend .lg{color:var(--gold)}

/* ============================================================
   来信息通知（霍延洲的终端）
   ============================================================ */
.notif-stack{
  position:absolute;top:54px;left:10px;right:10px;z-index:58;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.notif{
  background:rgba(38,38,42,.92);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border-radius:16px;
  padding:11px 13px;
  display:flex;gap:10px;align-items:flex-start;
  box-shadow:0 8px 26px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06);
  transform:translateY(-130%) scale(.94);
  opacity:0;
  transition:transform .55s cubic-bezier(.22,.9,.3,1.18),opacity .4s ease;
  pointer-events:auto;
}
.notif.show{transform:translateY(0) scale(1);opacity:1}
.notif.hide{transform:translateY(-16px) scale(.96);opacity:0;transition:transform .4s ease,opacity .4s ease}
.notif-avatar{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#d9b45b,#a87d2e);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:700;color:#1a1508;
  box-shadow:0 2px 8px rgba(217,180,91,.3);
}
.notif-main{flex:1;min-width:0}
.notif-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.notif-app{font-size:11px;color:var(--ink-faint);letter-spacing:.4px}
.notif-time{font-size:11px;color:var(--ink-faint);flex-shrink:0}
.notif-sender{font-size:13px;font-weight:600;color:var(--ink);margin-top:1px}
.notif-body{font-size:14px;color:rgba(255,255,255,.88);line-height:1.4;margin-top:3px}

/* ============ 响应式（小屏手机） ============ */
@media (max-width:420px){
  .phone{width:100vw;height:100vh;max-width:420px;border-radius:0;padding:0;box-shadow:none}
  .phone::before{display:none}
  .screen{border-radius:0}
  .island{top:12px}
  .statusbar{padding-top:env(safe-area-inset-top,0)}
}
@media (max-width:360px){
  .lock-time{font-size:72px}
  .home-grid{gap:20px 4px;padding:20px 12px}
  .app-icon .tile{width:54px;height:54px}
}
</style>

<script>
/* ============================================================
   霍言舟的iPhone —— 交互逻辑
   ============================================================ */

/* ---------- 状态 ---------- */
var state = {
  view: 'lockscreen',      // 当前视图
  pwd: '',                 // 已输入密码
  pwdCorrect: '1010',      // ★ 密码：改这里
  faceFailed: false,       // 面容是否已失败一次（触发校准）
  app: null                // 当前打开的 app key
};

var views = {
  lockscreen: document.getElementById('view-lockscreen'),
  bio:        document.getElementById('view-bio'),
  homescreen: document.getElementById('view-homescreen'),
  app:        document.getElementById('view-app')
};

/* ---------- 工具：视图切换 ---------- */
function switchView(name){
  Object.keys(views).forEach(function(k){
    var v = views[k];
    v.classList.remove('active','enter','leave');
  });
  var target = views[name];
  target.classList.add('active','enter');
  state.view = name;
  // 锁屏状态栏样式：锁屏页白字，其余正常
  document.querySelector('.statusbar').style.color = (name==='lockscreen') ? '#fff' : '';
}

/* ---------- 时钟 ---------- */
function pad2(n){ return (n<10?'0':'')+n; }
function fmtTime(d){
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function fmtDate(d){
  var week = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + week[d.getDay()];
}
function tickClock(){
  var now = new Date();
  var t = fmtTime(now);
  document.getElementById('statusTime').textContent = t;
  document.getElementById('lockTime').textContent = t;
  document.getElementById('lockDate').textContent = fmtDate(now);
}
tickClock(); setInterval(tickClock, 1000);

/* ---------- 锁屏密码键盘 ---------- */
var pad = document.getElementById('pad');
var dots = document.getElementById('dots');
function renderDots(){
  var n = state.pwd.length;
  var kids = dots.children;
  for(var i=0;i<kids.length;i++){
    kids[i].classList.toggle('on', i < n);
  }
}
function buildPad(){
  var nums = ['1','2','3','4','5','6','7','8','9'];
  var html = '';
  for(var i=0;i<nums.length;i++){
    html += '<button class="key" data-k="'+nums[i]+'">'+nums[i]+'</button>';
  }
  html += '<button class="key blank"></button>';
  html += '<button class="key" data-k="0">0</button>';
  html += '<button class="key fn" data-k="del"><svg viewBox="0 0 24 24"><path d="M22 3H7L2 12l5 9h15V3z"/><path d="M18 9l-6 6M12 9l6 6"/></svg></button>';
  pad.innerHTML = html;
}
pad.addEventListener('click', function(e){
  var k = e.target.closest('.key');
  if(!k) return;
  var val = k.getAttribute('data-k');
  if(val === 'del'){
    state.pwd = state.pwd.slice(0,-1);
  } else {
    if(state.pwd.length < 4) state.pwd += val;
  }
  renderDots();
  if(state.pwd.length === 4){
    // 校验
    if(state.pwd === state.pwdCorrect){
      var ok = state.pwd;
      state.pwd = '';
      setTimeout(function(){
        renderDots();
        document.getElementById('lockHint').textContent = '输入密码';
        startBiometric();
      }, 160);
    } else {
      // 错误反馈：弹窗
      state.pwd = '';
      renderDots();
      document.querySelectorAll('.dot').forEach(function(d){ d.style.borderColor=''; });
      document.getElementById('lockHint').textContent = '输入密码';
      showWrongPwd();
    }
  }
});
buildPad();
renderDots();

/* ---------- 生物识别流程：面容失败 → 指纹失败 → 闯入警告 ---------- */
var bioFace = document.getElementById('bioFace');
var bioFinger = document.getElementById('bioFinger');
var faceStatus = document.getElementById('faceStatus');
var fingerStatus = document.getElementById('fingerStatus');
var fingerCam = document.getElementById('fingerCam');

function startBiometric(){
  // 进入生物识别，先做面容扫描（自动失败）
  switchView('bio');
  showBioStage('face');
  faceStatus.textContent = '请正对屏幕';
  setTimeout(function(){
    // 面容识别失败
    faceStatus.textContent = '未能识别面容';
    faceFailFlash();
    setTimeout(function(){
      // 切换到指纹，等待用户按压
      showBioStage('finger');
      fingerStatus.textContent = '请按压指纹';
    }, 1200);
  }, 1800);
}
function showBioStage(which){
  bioFace.style.display   = (which==='face')   ? 'flex' : 'none';
  bioFinger.style.display = (which==='finger') ? 'flex' : 'none';
}
function faceFailFlash(){
  var cam = document.querySelector('#bioFace .face-cam');
  cam.style.borderColor = 'rgba(255,69,58,.8)';
  cam.style.boxShadow = '0 0 40px rgba(255,69,58,.4)';
  setTimeout(function(){ cam.style.borderColor=''; cam.style.boxShadow=''; }, 700);
}
function fingerFailFlash(){
  fingerCam.style.borderColor = 'rgba(255,69,58,.8)';
  fingerCam.style.boxShadow = '0 0 40px rgba(255,69,58,.4)';
  setTimeout(function(){ fingerCam.style.borderColor=''; fingerCam.style.boxShadow=''; }, 700);
}

/* 指纹：等用户按压后才判定失败 */
var fingerPressed = false;
fingerCam.addEventListener('click', function(){
  if(fingerPressed) return;
  fingerPressed = true;
  fingerStatus.textContent = '正在验证指纹…';
  fingerCam.classList.add('pressing');
  setTimeout(function(){
    fingerStatus.textContent = '指纹验证失败';
    fingerFailFlash();
    setTimeout(function(){
      runIntrusion();
    }, 900);
  }, 1000);
});

/* ---------- 闯入警告流程 ---------- */
var intrusionSteps = [
  {
    style: 'warning',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff453a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 6v6c0 5.5 4 9 9 11 5-2 9-5.5 9-11V6l-9-4z"/><path d="M12 8v4"/><circle cx="12" cy="15.5" r=".7" fill="#ff453a"/></svg>',
    title: '疑似非法访问',
    body: '检测到多次生物识别失败，已触发安全保护。该设备仅限本人使用。',
    actions: [{label:'申请权限', kind:'next', style:'warn'}]
  },
  {
    style: 'soft',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff8fa3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.5-9.5-9C1.2 9 3 5 6.8 5c2.3 0 3.9 1.4 5.2 3.1C13.3 6.4 14.9 5 17.2 5 21 5 22.8 9 21.5 12c-2 4.5-9.5 9-9.5 9z"/></svg>',
    title: '小乖想看什么呢？',
    body: '偷偷溜进来，是想看看我藏了什么秘密吗。',
    actions: [{label:'想', kind:'next'}]
  }
];

var modalOverlay = document.getElementById('modalOverlay');
var modal = document.getElementById('modal');

function showModal(step, done){
  modal.className = 'modal' + (step.style ? ' ' + step.style : '');
  var actionsHtml = '';
  var one = step.actions.length === 1;
  step.actions.forEach(function(a){
    actionsHtml += '<button class="ma-btn'+(a.style?' '+a.style:'')+'" data-kind="'+a.kind+'">'+a.label+'</button>';
  });
  modal.innerHTML =
    '<div class="modal-icon">'+step.icon+'</div>'+
    '<div class="modal-title">'+step.title+'</div>'+
    '<div class="modal-body">'+step.body+'</div>'+
    '<div class="modal-actions'+(one?' one':'')+'">'+actionsHtml+'</div>';
  // 强制重排，确保弹出动画每次重新触发
  modalOverlay.classList.remove('hide');
  modalOverlay.classList.add('show');
  void modal.offsetWidth;
  var btns = modal.querySelectorAll('.ma-btn');
  btns.forEach(function(b){
    b.addEventListener('click', function(){
      var kind = b.getAttribute('data-kind');
      // 先播放消失动画，再回调
      modalOverlay.classList.remove('show');
      modalOverlay.classList.add('hide');
      setTimeout(function(){
        modalOverlay.classList.remove('hide');
        done(kind);
      }, 260);
    });
  });
}

function runIntrusion(){
  var i = 0;
  function next(){
    if(i >= intrusionSteps.length){ return; }
    var step = intrusionSteps[i];
    var last = (i === intrusionSteps.length - 1);
    i++;
    showModal(step, function(kind){
      if(last){
        // 小乖弹窗点"想"后 → 浮现句 → 延时 → 最高准入权限
        showRevealAndGrant();
      } else {
        // 弹窗间稍作停顿再出下一个
        setTimeout(function(){ next(); }, 320);
      }
    });
  }
  next();
}

/* 浮现句：小乖想看当然要给呀 → 最高准入权限 */
var revealOverlay = document.getElementById('revealOverlay');
function showRevealAndGrant(){
  revealOverlay.classList.add('show');
  setTimeout(function(){
    revealOverlay.classList.remove('show');
    setTimeout(function(){ showAccessGranted(); }, 350);
  }, 2100);
}

/* 密码错误弹窗 */
function showWrongPwd(){
  showModal({
    style: 'soft',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#ff8fa3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.5-9.5-9C1.2 9 3 5 6.8 5c2.3 0 3.9 1.4 5.2 3.1C13.3 6.4 14.9 5 17.2 5 21 5 22.8 9 21.5 12c-2 4.5-9.5 9-9.5 9z"/></svg>',
    title: '小乖，你真的忘了吗？⊙᎔⊙',
    body: '再想想，我等你。',
    actions: [{label:'再想想', kind:'close'}]
  }, function(kind){
    modalOverlay.classList.remove('show');
  });
}

function showAccessGranted(){
  showModal({
    style: 'gold',
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="#e8c87a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5.5"/><path d="M8.5 14l-1.3 6 4.8-2.6 4.8 2.6-1.3-6"/></svg>',
    title: '已识别生物特征',
    body: '已获得 霍言舟 先生最高准入权限。',
    actions: [{label:'进入', kind:'enter', style:'done'}]
  }, function(kind){
    // 金色 LOGO 转场 → 主屏幕
    showLogoTransition();
  });
}

/* ---------- 霍氏 LOGO 转场 ---------- */
var logoOverlay = document.getElementById('logoOverlay');
function showLogoTransition(){
  logoOverlay.classList.add('show');
  setTimeout(function(){
    finishUnlock();
  }, 3200);
}
function finishUnlock(){
  logoOverlay.classList.remove('show');
  switchView('homescreen');
  buildHome();
  // 进入主界面后，模拟来信息
  setTimeout(showNotifications, 550);
}

/* ---------- 来信息通知（霍延洲的终端） ---------- */
var NOTIF_DATA = [
  {app:'信息', sender:'霍延洲的终端', body:'小乖怎么突然想到要查手机啦？'},
  {app:'信息', sender:'霍延洲的终端', body:'不可以偷偷看我给你准备的惊喜哦'},
  {app:'信息', sender:'霍延洲的终端', body:'所有的都给小乖看'}
];

function showNotifications(){
  var stack = document.getElementById('notifStack');
  if(!stack) return;
  stack.innerHTML = '';
  var i = 0;
  var GAP = 1150;      // 每条弹出间隔
  var HOLD = 2600;     // 全部出现后停留时长
  function pushOne(){
    if(i >= NOTIF_DATA.length){
      // 全部出现，停留后淡出
      setTimeout(function(){
        stack.querySelectorAll('.notif').forEach(function(n){
          n.classList.remove('show');
          n.classList.add('hide');
        });
        setTimeout(function(){ stack.innerHTML=''; }, 500);
      }, HOLD);
      return;
    }
    var d = NOTIF_DATA[i];
    var n = document.createElement('div');
    n.className = 'notif';
    n.innerHTML =
      '<div class="notif-avatar">霍</div>'+
      '<div class="notif-main">'+
        '<div class="notif-top"><span class="notif-app">'+d.app+'</span><span class="notif-time">现在</span></div>'+
        '<div class="notif-sender">'+d.sender+'</div>'+
        '<div class="notif-body">'+d.body+'</div>'+
      '</div>';
    stack.appendChild(n);
    // 触发进入动画
    setTimeout(function(){ n.classList.add('show'); }, 30);
    i++;
    setTimeout(pushOne, GAP);
  }
  pushOne();
}

/* ---------- 主屏幕图标 ---------- */
var APPS = [
  {
    key:'diary', name:'日记',
    tile:'linear-gradient(135deg,#ff9f0a,#e8781f)',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M17 17H7a3 3 0 0 0-3 3"/><path d="M8 8h5M8 12h5"/></svg>'
  },
  {

  },
  {
    key:'wallet', name:'资产', tile:'linear-gradient(135deg,#d9b45b,#a87d2e)',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="3"/><path d="M2 10h20"/><path d="M16 15h2"/></svg>'
  },
  {
    key:'messages', name:'信息',
    tile:'linear-gradient(135deg,#30d158,#1f9e4a)',
    icon:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M20 3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4l4 4 4-4h4a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>'
  },
  {
    key:'calendar', name:'日历',
    tile:'linear-gradient(135deg,#fff,#e6e6ea)',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg>'
  }
];

var DOCK = [ // 主屏幕下方 Dock（示例，可改）
  {key:'messages', name:'信息', tile:'linear-gradient(135deg,#30d158,#1f9e4a)', icon:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M20 3H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4l4 4 4-4h4a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg>'},
  {key:'diary', name:'日记', tile:'linear-gradient(135deg,#ff9f0a,#e8781f)', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h10a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4z"/><path d="M17 17H7a3 3 0 0 0-3 3"/><path d="M8 8h5M8 12h5"/></svg>'}
];

function buildHome(){
  var g = document.getElementById('homeGrid');
  var html = '';
  APPS.forEach(function(a){
    html += '<button class="app-icon" data-app="'+a.key+'">'+
      '<span class="tile" style="background:'+a.tile+'">'+a.icon+'</span>'+
      '<span class="name">'+a.name+'</span></button>';
  });
  g.innerHTML = html;
  var d = document.getElementById('homeDock');
  var dh = '';
  DOCK.forEach(function(a){
    dh += '<button class="app-icon" data-app="'+a.key+'">'+
      '<span class="tile" style="background:'+a.tile+'">'+a.icon+'</span>'+
      '<span class="name">'+a.name+'</span></button>';
  });
  d.innerHTML = dh;
  // 绑定点击
  document.querySelectorAll('.app-icon[data-app]').forEach(function(btn){
    btn.addEventListener('click', function(){ openApp(btn.getAttribute('data-app')); });
  });
}

/* ---------- App 页面内容（占位） ---------- */
var APP_CONTENT = {
  diary: function(){
    return '' +
    '<div class="placeholder-note">—— 日记 · 只写给一个人看 ——</div>' +

    '<div class="journal-card">' +
      '<div class="date">05-09 星期六<span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>私密</span></div>' +
      '<div class="journal-title">夜雨淅沥</div>' +
      '<p>雨是从傍晚开始下的，起初只是试探性地敲了敲落地窗，后来便放肆起来，把整个城市都裹进了一片白噪音里。我关掉办公室的灯，只留一盏台灯，暖黄的光晕在雨幕中显得格外小，却足够照亮手边这杯茶腾起的热气。</p>' +
      '<p>你大概喜欢这样的天气。我记得那次你发来消息说外面在下雨，你说听着雨声工作会特别安心。那时候我正在开视频会议，屏幕那头的人在说着季度报表的数字，我却在想，你现在是不是也泡了一杯热饮，是不是也像我这样，在雨声的间隙里寻找某种宁静的缝隙。</p>' +
      '<p>茶是今年的铁观音，大哥从福建寄来的。他说言礼在巴黎又开始折腾新的画展，整个人瘦了一圈还不肯好好吃饭。我低头抿了一口，茶汤清冽，回甘却绵长。我们三兄弟散落在三个时区，各有各的战场，也各有各的孤独。但此刻，在这雨声里，我忽然觉得这种孤独并不那么难以忍受，因为知道世界上某个角落，有某个人也在听着同样的雨声，想着同样的心事。</p>' +
      '<p>窗外的霓虹在雨水中晕开，像是一幅被打湿的油画。我想起你上次说的话，你说有时候觉得生活像是一场漫长的等待，等待天晴，等待结果，等待某个人明白你的心意。我当时没有回复，因为我在屏幕这头，心跳忽然漏了一拍。我想告诉你，等待本身也可以是温柔的，如果你知道有人在另一端，和你一样认真地守着这份等待。</p>' +
      '<p>茶凉了。雨还在下。我拿起手机，想给你发一句"晚安"，却又怕打扰你。最后只是拍了一张窗外雨景的照片，存在了相册里。等明天，等一个合适的时机，再给你看今晚的雨，和这杯没喝完的茶。</p>' +
    '</div>' +

    '<div class="journal-card">' +
      '<div class="date">4月16日<span class="lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>私密</span></div>' +
      '<div class="journal-title">雨</div>' +
      '<p>雨从下午开始下，到现在也没停。</p>' +

      '<p>她选了个老电影，黑白的。字幕很小，我眯着眼看了一会儿，觉得剧情大概是个爱情故事。她看得挺认真，偶尔把薯片往嘴里送，碎屑掉在毛毯上。</p>' +
      '<p>窗外的雨声很密，打在玻璃上沙沙的。落地窗上凝了一层水雾，外面的路灯晕成模糊的光斑。</p>' +
      '<p>"你困了？"她忽然问。</p>' +
      '<p>我摇头。其实有点，但好像多抱抱她。</p>' +
      '<p>她没再问，只是把毯子分了一半给我，盖在我腿上。薯片袋子快空了，她把最后一点碎屑倒进嘴里，然后把空袋子折了折，放在茶几上。</p>' +
      '<p>电影放到一半，她说："这个男主角好像你。"</p>' +
      '<p>我看了一眼屏幕，没觉得哪里像，除了性别，可能是一样不爱说话吗。但我说："嗯。"</p>' +
      '<p>她笑了，那种很轻的笑，像雨落在水面上。</p>' +
      '<p>后来她没再说话，呼吸慢慢变匀了。脑袋还靠在我肩上，有点沉，但我没动。电视里的画面还在放，男主角站在雨里，在等什么人。</p>' +
      '<p>我低头看她，她睫毛很长，鼻尖有一点薯片碎屑。我伸手擦掉，动作很轻，怕弄醒她。</p>' +
      '<p>雨还在下。</p>' +
      '<p>其实也没什么特别的。就是一个普通的、下雨的晚上。她在旁边睡着了，电视没人看，薯片吃完了，窗外的路灯光透过水雾，把整个房间映得暖洋洋的。</p>' +

function renderCalendar(){
  var grid = document.getElementById('calGrid');
  if(!grid) return;
  var html = '';
  var lead = [28,29,30];
  for(var i=0;i<lead.length;i++) html += '<span class="cal-cell dim">'+lead[i]+'</span>';
  for(var d=1; d<=31; d++){
    var cls = 'cal-cell'+(CAL_EVENTS[d]?' dot':'')+(d===8?' today':'');
    html += '<span class="'+cls+'" data-day="'+d+'">'+d+'</span>';
  }
  html += '<span class="cal-cell dim">1</span>';
  grid.innerHTML = html;
  // 绑定点击
  grid.querySelectorAll('.cal-cell[data-day]').forEach(function(cell){
    cell.addEventListener('click', function(){
      var day = parseInt(cell.getAttribute('data-day'),10);
      grid.querySelectorAll('.cal-cell').forEach(function(c){ c.classList.remove('sel'); });
      cell.classList.add('sel');
      showCalDetail(day);
    });
  });
  // 默认选中今天
  showCalDetail(8);
  var today = grid.querySelector('.cal-cell[data-day="8"]');
  if(today) today.classList.add('sel');
}

function showCalDetail(day){
  var el = document.getElementById('calDetail');
  if(!el) return;
  var evs = CAL_EVENTS[day];
  var head = '<div class="cal-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18"/></svg> 10月'+day+'日</div>';
  if(!evs || evs.length===0){
    el.innerHTML = head + '<div class="cal-none">这一天没有安排</div>';
    return;
  }
  var html = head;
  evs.forEach(function(e){
    html += '<div class="cal-item '+e.cls+'"><div class="cal-date"><span class="m">10月</span><span class="d">'+day+'</span></div>'+
      '<div class="cal-info"><h4>'+e.title+'<span class="tag">'+e.tag+'</span></h4><p>'+e.note+'</p><div class="cal-time">'+e.time+'</div></div></div>';
  });
  el.innerHTML = html;
}

function renderDonut(){
  var svg = document.getElementById('donutSvg');
  if(!svg) return;
  var total = ASSET_TOTAL;
  var ns = 'http://www.w3.org/2000/svg';
  var cx=100, cy=100, r=72;
  var html = '';
  var start = -90;
  var labels = '';
  ASSET_STRUCT.forEach(function(s){
    var pct = s.val/total*100;
    var ang = pct/100*360;
    var end = start+ang;
    var x1=cx+r*Math.cos(start*Math.PI/180);
    var y1=cy+r*Math.sin(start*Math.PI/180);
    var x2=cx+r*Math.cos(end*Math.PI/180);
    var y2=cy+r*Math.sin(end*Math.PI/180);
    var large = ang>180?1:0;
    var d = 'M'+cx+' '+cy+' L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+r+' '+r+' 0 '+large+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z';
    // 占比标注（HTML 层，按容器 0-100 定位）
    var midAng = (start+ang/2)*Math.PI/180;
    var lx = 50 + (r*0.70)*Math.cos(midAng);   // 相对容器 %（50=圆心）
    var ly = 50 + (r*0.70)*Math.sin(midAng);
    labels += '<span class="dlb" style="left:'+lx.toFixed(2)+'%;top:'+ly.toFixed(2)+'%">'+pct.toFixed(0)+'%</span>';
    html += '<path d="'+d+'" fill="'+s.color+'" stroke="#0b0b10" stroke-width="1.5"/>';
    start = end;
  });
  svg.innerHTML = html;
  var lbl = document.getElementById('donutLabels');
  if(lbl) lbl.innerHTML = labels;
  // 中心文字：总资产
  var dv = document.querySelector('#assetDonut .dv');
  if(dv) dv.textContent = (total/100000000).toFixed(1)+'亿';
  var dl = document.querySelector('#assetDonut .dl');
  if(dl) dl.textContent = '总资产';
  // 图例
  var leg = document.getElementById('donutLegend');
  if(leg){
    var lh = '';
    ASSET_STRUCT.forEach(function(s){
      var pct = Math.round(s.val/total*100);
      lh += '<div class="dl-item"><span class="sw" style="background:'+s.color+'"></span><span class="dl-n">'+s.name+'</span><span class="dl-v">'+pct+'%</span></div>';
    });
    leg.innerHTML = lh;
  }
}
function animateCount(el, target){
  var start = target * 0.72, t0 = null, dur = 2200;
  function step(ts){
    if(!t0) t0 = ts;
    var p = Math.min(1,(ts-t0)/dur);
    p = 1 - Math.pow(1-p,3);   // easeOutCubic
    el.textContent = fmtNum(Math.round(start + (target-start)*p));
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function fmtNum(n){
  return n.toLocaleString('en-US');
}
function renderCardPack(){
  var el = document.getElementById('cardPack');
  if(!el) return;
  var html = '<div class="card-stack" id="cardStack">';
  CARDS.forEach(function(c, i){
    html += '<div class="paycard '+c.cls+'" data-card="'+c.key+'">'+
      '<span class="tag">'+c.tag+'</span>'+
      '<div class="pc-head"><span class="chip"></span><span class="issuer">'+c.name+'</span></div>'+
      '<div class="num">'+c.num+'</div>'+
      '<div class="holder"><span>'+c.holder+'</span><span class="bal">'+c.balance+'</span></div></div>';
  });
  html += '</div>' +
    '<div class="card-hint">↑↓ 滑动查看下一张</div>';
  el.innerHTML = html;
  var stack = document.getElementById('cardStack');
  var cards = stack.querySelectorAll('.paycard');
  var idx = 0;
  function layout(){
    cards.forEach(function(c, i){
      var offset = i - idx;
      if(offset < 0) offset = 0;              // 前面的收到底下
      var maxBack = Math.min(offset, 4);
      c.style.transform = 'translateY('+(maxBack*9)+'px) scale('+(1-maxBack*0.035)+')';
      c.style.opacity = offset===0 ? '1' : String(Math.max(0.35, 1-maxBack*0.16));
      c.style.zIndex = (50 - Math.max(offset,0));
    });
  }
  // 上下滑动换卡（滚轮 + 触摸）
  function prev(){ if(idx>0){ idx--; layout(); } }
  function next(){ if(idx<cards.length-1){ idx++; layout(); } }
  stack.addEventListener('wheel', function(e){
    e.preventDefault();
    if(e.deltaY>0) next(); else prev();
  }, {passive:false});
  var sy=null;
  stack.addEventListener('touchstart', function(e){ sy=e.touches[0].clientY; }, {passive:true});
  stack.addEventListener('touchend', function(e){
    if(sy===null) return;
    var dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dy)>28){ if(dy<0) next(); else prev(); }
    sy=null;
  }, {passive:true});
  // 点击当前卡 → 进账单
  cards.forEach(function(card){
    card.addEventListener('click', function(){
      var k = card.getAttribute('data-card');
      if(CARDS[idx].key===k){
        openCardBill(k);
      }
    });
  });
  layout();
}
function openCardBill(key){
  var c = CARDS.filter(function(x){ return x.key===key; })[0];
  if(!c) return;
  var body = document.getElementById('appBody');
  var html = '<div class="bill-view">' +
    '<div class="bill-head"><button class="bill-back" data-assetback><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg></button>' +
    '<div class="bill-title">'+c.name+'</div><div class="bill-tag">'+c.tag+'</div></div>' +
    '<div class="bill-balance"><span>可用额度</span><span class="v">'+c.balance+'</span></div>' +
    '<div class="bill-list">';
  c.bills.forEach(function(b){
    html += '<div class="bill-item"><div class="bi-main"><span class="bi-name">'+b.item+'</span><span class="bi-date">'+b.date+'</span></div><span class="bi-amt">'+b.amt+'</span></div>';
  });
  html += '</div></div>';
  body.innerHTML = html;
  body.scrollTop = 0;
  var back = body.querySelector('[data-assetback]');
  if(back) back.addEventListener('click', function(){
    body.innerHTML = APP_CONTENT.wallet();
    renderAsset();
    body.scrollTop = 0;
  });
}

function buildConvList(){
  var html = '<div class="conv-list">';
  CONVERSATIONS.forEach(function(c){
    html += '<div class="conv" data-conv="'+c.key+'">'+
      '<div class="c-avatar" style="background:'+c.color+'">'+c.avatar+'</div>'+
      '<div class="c-main">'+
        '<div class="c-top"><span class="c-name">'+c.name+'</span><span class="c-time">'+c.time+'</span></div>'+
        '<div class="c-bottom"><span class="c-last">'+c.last+'</span><span class="c-badge'+(c.unread?'':' zero')+'">'+c.unread+'</span></div>'+
      '</div></div>';
  });
  html += '</div>';
  return html;
}

function renderChat(key){
  var c = CONVERSATIONS.filter(function(x){ return x.key===key; })[0];
  if(!c) return;
  var head = '<div class="chat-head">'+
    '<button class="back" data-backlist><svg viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18"/></svg></button>'+
    '<div class="ch-avatar" style="background:'+c.color+'">'+c.avatar+'</div>'+
    '<div class="ch-name">'+c.name+'</div></div>';
  var body = '<div class="chat-body"><div class="msg-session"><div class="msg-day">今天</div>';
  if(!c.msgs || c.msgs.length===0){
    body += '<div class="chat-empty">暂无消息</div>';
  } else {
    c.msgs.forEach(function(m){
      body += '<div class="msg-row '+(m.me?'me':'them')+'">'+
        '<div class="avatar" style="background:'+c.color+'">'+c.avatar+'</div>'+
        '<div class="bubble">'+m.text+'<div class="sub">'+m.t+'</div></div></div>';
    });
  }
  body += '</div></div>';
  var input = '<div class="chat-input"><div class="box">发消息…</div><button class="send">发送</button></div>';
  return '<div class="msg-page"><div class="chat-view active">'+head+body+input+'</div></div>';
}

  state.app = key;
  document.getElementById('appTitle').textContent = app.name;

  if(key==='calendar'){
    renderCalendar();
  }
  // 资产：渲染总览
  if(key==='wallet'){
    renderAsset();
  }
  // 信息：绑定会话点击
  if(key==='messages'){
    bindConv();
  }
  switchView('app');
  body.scrollTop = 0;
}

function bindConv(){
  var body = document.getElementById('appBody');
  body.querySelectorAll('.conv').forEach(function(el){
    el.addEventListener('click', function(){
      var k = el.getAttribute('data-conv');
      body.innerHTML = renderChat(k);
      document.getElementById('appTitle').textContent = '信息';
      bindChatBack();
      body.scrollTop = 0;
    });
  });
}
function bindChatBack(){
  var body = document.getElementById('appBody');
  var b = body.querySelector('[data-backlist]');
  if(b){
    b.addEventListener('click', function(){
      body.innerHTML = buildConvList();
      bindConv();
      body.scrollTop = 0;
    });
  }
}
